<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hachiko Questions</title>
<meta name="description" content="Vocabulary and comprehension questions for Hachiko: The True Story of a Loyal Dog">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16244f; --navy2:#22357a; --gold:#f5b70a; --gold2:#ffd75e;
  --ink:#1d2340; --muted:#5b6386; --bg:#f4f1ff; --card:#ffffff; --line:#e3e1f2;
  --good:#16a34a; --goodbg:#e7f9ee; --bad:#dc2626; --badbg:#fdecec; --warn:#b45309; --warnbg:#fff4dc;
  --accent:#7b3fe4; --accent2:#ff5fa2; --accentbg:#f1e9ff;
  --r:18px; --shadow:0 6px 0 rgba(22,36,79,.10), 0 10px 24px rgba(22,36,79,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);background-image:radial-gradient(circle at 10% 0%,rgba(255,255,255,.9),transparent 40%),radial-gradient(circle at 100% 20%,var(--accentbg),transparent 45%);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.55;min-height:100vh;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,.fred{font-family:"Fredoka","Nunito",system-ui,sans-serif;line-height:1.2;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font-family:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* top bar */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 3px 0 var(--gold)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:52px;width:auto;background:#fff;border-radius:10px;padding:3px}
.wordmark{font-family:"Fredoka",sans-serif;font-weight:600;line-height:1.05;font-size:15px;color:var(--gold2)}
.wordmark b{display:block;color:#fff;font-size:19px;letter-spacing:.5px}
.brand .ttl{font-family:"Fredoka",sans-serif;font-size:17px;font-weight:500;opacity:.95;border-left:2px solid rgba(255,255,255,.25);padding-left:10px}
.stats{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:4px 10px;font-weight:800;font-size:15px;white-space:nowrap}
.chip.gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.ibtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:12px;padding:5px 10px;font-weight:800;font-size:15px}
.saved{font-size:13px;color:#b9f3c9;opacity:0;transition:opacity .4s;white-space:nowrap}
.saved.on{opacity:1}
.xpbar{height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;width:100%}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;transition:width .6s}
.lvlrow{width:100%;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--gold2)}
.lvlrow .xpbar{flex:1}

main{padding:22px 0 40px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;border:2px solid var(--line)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:stretch}
.hero h1{font-size:34px;color:var(--navy)}
.hero .kicker{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px;margin-bottom:10px}
.hero p{margin:.6em 0}
.namebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.namebox input{flex:1;min-width:160px;font-size:20px;padding:10px 14px;border-radius:14px;border:3px solid var(--line);outline:none}
.namebox input:focus{border-color:var(--accent)}
.btn{border:none;border-radius:14px;padding:12px 20px;font-weight:900;font-size:18px;background:var(--accent);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border:3px solid var(--line);box-shadow:none}
.btn.green{background:var(--good)}
.btn.sm{padding:8px 14px;font-size:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.say{border:2px solid var(--accent);background:var(--accentbg);color:var(--accent);border-radius:999px;padding:5px 12px;font-weight:900;font-size:15px;white-space:nowrap}
.say.on{background:var(--accent);color:#fff}
.howto{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:none}
.howto h3{color:var(--gold2);margin-bottom:8px}
.howto ul{margin:0;padding-left:0;list-style:none}
.howto li{margin:6px 0;padding-left:34px;position:relative}
.howto li span{position:absolute;left:0;top:0;font-size:22px}

.sect{display:flex;align-items:center;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.sect h2{font-size:24px;color:var(--navy)}
.sect .sub{color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.lockc{position:relative;text-align:left;background:#fff;border:3px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s;color:var(--ink)}
.lockc:hover{transform:translateY(-3px);border-color:var(--accent)}
.lockc .ic{font-size:36px;line-height:1}
.lockc h3{font-size:20px;color:var(--navy)}
.lockc .code{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.3px}
.lockc .sk{font-size:15px;color:var(--muted)}
.lockc .st{margin-top:auto;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.pill{border-radius:999px;padding:3px 10px;font-weight:900;font-size:13px}
.pill.new{background:#eef0fb;color:var(--navy2)}
.pill.go{background:var(--warnbg);color:var(--warn)}
.pill.done{background:var(--goodbg);color:var(--good)}
.lockc .keyabs{position:absolute;top:10px;right:10px}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:800;font-size:15px}
.badge .e{font-size:24px}
.badge.lock{opacity:.4;filter:grayscale(1)}
.badge small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.vaultcta{margin-top:20px;text-align:center;background:linear-gradient(135deg,#fff7d6,#ffe9a8);border:3px solid var(--gold)}
.vaultcta h2{color:var(--navy);margin-bottom:6px}

/* lock view */
.lockhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.lockhead .ic{font-size:40px}
.lockhead h2{font-size:26px;color:var(--navy)}
.lockhead .code{font-size:13px;font-weight:800;color:var(--muted)}
.steps{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.stp{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-weight:900;font-size:14px;color:var(--muted)}
.stp.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stp.ok{background:var(--goodbg);border-color:#a7e3bd;color:var(--good)}
.lcard{max-width:860px;margin:0 auto}
.lcard .chead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.lcard .chead h3{font-size:24px;color:var(--navy);flex:1;min-width:200px}
.tag{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:900;font-size:13px;background:var(--accentbg);color:var(--accent)}
.cbody p{margin:.5em 0}
.cbody .big{font-size:21px}
.callout{border-radius:14px;padding:12px 16px;margin:12px 0;border-left:6px solid var(--accent);background:var(--accentbg)}
.callout.gold{border-color:var(--gold);background:#fff7dd}
.callout.green{border-color:var(--good);background:var(--goodbg)}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.term{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.term b{display:block;color:var(--accent);font-size:18px}
.term span{font-size:16px}
.flip{cursor:pointer;min-height:92px;position:relative}
.flip .back{display:none}
.flip.open .front{display:none}
.flip.open .back{display:block}
.flip .front{font-family:"Fredoka",sans-serif;font-size:20px;color:var(--navy);display:flex;align-items:center;justify-content:center;height:100%;text-align:center;flex-direction:column}
.flip .front small{font-family:"Nunito";font-size:13px;color:var(--muted);font-weight:700}
.stepl{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.stepl li{counter-increment:s;position:relative;padding:10px 12px 10px 56px;margin:8px 0;background:#fff;border:2px solid var(--line);border-radius:14px}
.stepl li:before{content:counter(s);position:absolute;left:12px;top:10px;width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:900;display:flex;align-items:center;justify-content:center;font-family:"Fredoka"}
.stepl li b{color:var(--navy)}
.ex{background:#fffdf5;border:2px dashed var(--gold);border-radius:14px;padding:12px 16px;margin:10px 0;font-family:Georgia,"Times New Roman",serif;font-size:18px}
.think{list-style:none;padding:0;margin:10px 0}
.think li{display:flex;gap:10px;align-items:flex-start;margin:8px 0;background:#f6f8ff;border-radius:12px;padding:10px 12px}
.think li:before{content:"💭";font-size:20px}
.myth{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.myth div{border-radius:14px;padding:10px 14px}
.myth .m{background:var(--badbg);border:2px solid #f5c2c2}
.myth .f{background:var(--goodbg);border:2px solid #a7e3bd}
.myth b{display:block;font-size:14px;letter-spacing:.4px}
.myth .m b{color:var(--bad)}
.myth .f b{color:var(--good)}
table.t{width:100%;border-collapse:separate;border-spacing:0;border:2px solid var(--line);border-radius:14px;overflow:hidden;margin:10px 0;font-size:16px}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-family:"Fredoka";font-weight:500}
table.t td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top;background:#fff}
table.t tr:nth-child(even) td{background:#faf9ff}
.tablewrap{overflow-x:auto}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent);transform:scale(1.25)}
.dot.g{background:var(--good)}.dot.y{background:var(--gold)}.dot.r{background:#f08a8a}

/* practice */
.prac{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.prac.solo{grid-template-columns:1fr;max-width:860px;margin:0 auto}
.passage{position:sticky;top:120px;max-height:calc(100vh - 140px);overflow:auto}
.passage h3{color:var(--navy);font-size:21px}
.ptext{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.65}
.ptext p{margin:.6em 0}
.ptext .pn{display:inline-block;min-width:22px;font-family:"Nunito";font-weight:900;font-size:12px;color:#fff;background:var(--navy2);border-radius:6px;padding:0 5px;margin-right:6px;vertical-align:2px;text-align:center}
.ptext .poem{white-space:pre-line;font-style:italic}
.ptext h4{font-family:"Fredoka";color:var(--accent);margin-top:10px}
.ptext .src{font-family:"Nunito";font-size:13px;color:var(--muted)}
.qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dok{border-radius:999px;padding:4px 12px;font-weight:900;font-size:13px;color:#fff}
.dok1{background:#0ea5a4}.dok2{background:#2563eb}.dok3{background:#9333ea}
.qnum{font-weight:900;color:var(--muted);font-size:14px}
.qtext{font-size:21px;font-weight:800;color:var(--navy);margin:6px 0 14px}
.excerpt{background:#fffdf5;border-left:5px solid var(--gold);padding:10px 14px;border-radius:10px;font-family:Georgia,serif;margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 14px;font-size:18px;color:var(--ink);transition:border-color .1s,transform .08s;width:100%}
.opt:hover{border-color:var(--accent)}
.opt .L{flex:none;width:34px;height:34px;border-radius:10px;background:var(--accentbg);color:var(--accent);font-weight:900;display:flex;align-items:center;justify-content:center;font-family:"Fredoka"}
.opt.wrong{border-color:#f5b5b5;background:var(--badbg);color:#8a2b2b;pointer-events:none}
.opt.wrong .L{background:var(--bad);color:#fff}
.opt.right{border-color:var(--good);background:var(--goodbg);pointer-events:none}
.opt.right .L{background:var(--good);color:#fff}
.opt.dim{opacity:.55;pointer-events:none}
.fb{margin-top:14px;border-radius:16px;padding:14px 16px;font-size:17px;animation:pop .25s ease}
.fb.bad{background:var(--badbg);border:2px solid #f5c2c2}
.fb.good{background:var(--goodbg);border:2px solid #a7e3bd}
.fb.hint{background:#fff7dd;border:2px solid #f6d77c}
.fb h4{font-size:19px;margin-bottom:4px}
.fb.bad h4{color:var(--bad)}.fb.good h4{color:var(--good)}.fb.hint h4{color:var(--warn)}
.fb .fbrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.qtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.hintbtn{border:2px dashed var(--gold);background:#fffaf0;color:var(--warn);border-radius:999px;padding:6px 14px;font-weight:900;font-size:15px}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:900;text-decoration:underline;font-size:15px;padding:4px}
.pts{font-family:"Fredoka";font-weight:600;color:var(--accent)}
details.pmob{display:none}

/* result */
.result{text-align:center;max-width:720px;margin:0 auto}
.result h2{font-size:32px;color:var(--navy);margin:8px 0}
.bigkey{animation:spinin 1s cubic-bezier(.2,1.4,.4,1) both}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.rstat{background:#f7f6ff;border-radius:14px;padding:10px}
.rstat b{display:block;font-size:26px;font-family:"Fredoka";color:var(--accent)}
.rstat span{font-size:14px;font-weight:800;color:var(--muted)}

/* vault */
.vault{max-width:760px;margin:0 auto;text-align:center}
.door{width:260px;height:260px;margin:10px auto 20px;border-radius:50%;background:radial-gradient(circle,#c9ced9 0%,#8d95a8 60%,#5d667a 100%);border:12px solid #3d4558;position:relative;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:transform 1.4s cubic-bezier(.6,0,.3,1)}
.door .wheel{position:absolute;inset:60px;border-radius:50%;border:10px solid #2f3647;transition:transform 1.4s}
.door .wheel:before,.door .wheel:after{content:"";position:absolute;left:50%;top:-10px;bottom:-10px;width:10px;margin-left:-5px;background:#2f3647}
.door .wheel:after{transform:rotate(90deg)}
.door.open{transform:perspective(800px) rotateY(-75deg) translateX(-40px)}
.door.open .wheel{transform:rotate(540deg)}
.cert{background:#fff;border:6px double var(--gold);border-radius:20px;padding:26px;margin-top:10px}
.cert h1{font-size:32px;color:var(--navy)}
.cert .nm{font-family:"Fredoka";font-size:36px;color:var(--accent);margin:8px 0;border-bottom:3px solid var(--gold);display:inline-block;padding:0 20px}
.keyring{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:12px 0}

footer{text-align:center;color:var(--muted);font-size:13px;padding:20px 16px 30px}
footer button{font-size:12px;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--muted);margin-top:8px}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:99}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:var(--navy);color:#fff;border:3px solid var(--gold);border-radius:18px;padding:10px 18px;font-weight:900;font-size:18px;z-index:98;transition:transform .35s cubic-bezier(.2,1.4,.4,1);max-width:92vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spinin{from{transform:scale(0) rotate(-200deg)}to{transform:scale(1) rotate(0)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.wiggle{animation:wiggle .4s ease 2}

@media (max-width:900px){
  .prac{grid-template-columns:1fr}
  .passage{position:static;max-height:none}
  .hero{grid-template-columns:1fr}
}
@media (max-width:600px){
  body{font-size:17px}
  .top{position:relative}
  .passage{top:0}
  .brand .ttl{display:none}
  .hero h1{font-size:27px}
  .myth{grid-template-columns:1fr}
  .qtext{font-size:19px}
  .rstats{grid-template-columns:1fr 1fr}
  .card{padding:16px}
}
@media print{
  .top,footer,.noprint{display:none!important}
  body{background:#fff}
}
.opened{font-size:90px;line-height:1;margin:10px auto;filter:drop-shadow(0 0 24px rgba(245,183,10,.8));animation:spinin .9s cubic-bezier(.2,1.4,.4,1) both}
.hear{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--accent);background:#fff;color:var(--accent);border-radius:999px;padding:2px 10px;margin:2px 2px;font-weight:800;font-size:16px;font-family:inherit;vertical-align:middle}
.hear.on{background:var(--accent);color:#fff}
.bigword{font-family:"Fredoka",sans-serif;font-size:26px;color:var(--navy)}
.bigword u{text-decoration:none;background:var(--accentbg);color:var(--accent);border-radius:6px;padding:0 3px}

</style>
</head>

<div id="app"></div>
<canvas id="confetti"></canvas>
<div id="toast" role="status" aria-live="polite"></div>
<script>

<script>
window.TUTORIAL = {
id:"hachiko-questions",
short:"Hachiko Questions",
kicker:"Unit 2 · Anchor Text",
title:"Hachiko: Loyalty Quest",
intro:`Have your copy of <b>“Hachiko: The True Story of a Loyal Dog”</b> by Pamela S. Turner open next to this page (split-screen works great!). Each question tells you which <b>paragraph</b> to look at. Unlock all five locks to prove you understand Hachiko’s story.`,
theme:{accent:"#b5651d",accent2:"#e8a34b",accentbg:"#fbefe2"},
locks:[
/* ================= LOCK 1: PLOT & INTERACTIONS ================= */
{id:"hk1",code:"ELA.6.R.1.1",icon:"🚉",name:"Station Clues",skill:"Key details and how characters’ interactions move the plot",
remember:"Each interaction in Hachiko pushes the plot forward: Dr. Ueno’s routine sets up the waiting, Papa’s news is the turning point, and the people who care for Hachiko keep his waiting going for years.",
lesson:[
{t:"table",h:"Hachiko’s plot map",intro:"Use this map to find your way around the story. Paragraph numbers are in the left margin of your text.",head:["Plot stage","Paragraphs","What happens"],
rows:[["Exposition","1–9","Kentaro moves near Shibuya Station and meets Hachiko and Dr. Ueno."],
["Rising action","10–11","Kentaro and Hachiko become friends at the station."],
["Turning point","12–14","Papa comes home alone. Dr. Ueno has died."],
["More rising action","15–24","Hachiko is sent away, runs back, and keeps waiting for years. Kentaro meets Mr. Kobayashi."],
["Climax &amp; resolution","25–31","A statue is built, Hachiko dies at the station, and his spot becomes a famous meeting place."]]},
{t:"steps",h:"Strategy: Spot it → Ask it → Link it",steps:[
["Spot the interaction.","Who is talking or acting together? Kentaro and Papa? Hachiko and Dr. Ueno?"],
["Ask what changed.","Did someone learn news, make a choice, or change how they feel?"],
["Link it to the plot.","Does it set things up, build tension, turn the story, or resolve it?"]]},
{t:"check",h:"Quick Check",q:"In paragraph 12, Papa comes home alone, “hunched over, staring sadly at the gray pavement.” What does this detail do for the plot?",

/* ================= LOCK 2: THEME ================= */
{id:"hk2",code:"ELA.6.R.1.2",icon:"💛",name:"Loyalty Lessons",skill:"How the theme develops across the story",
remember:"A theme of Hachiko: true loyalty can last even after a loved one is gone. It is built across the story, from Hachiko’s daily routine with Dr. Ueno, to years of waiting, to a statue that brings people together.",
lesson:[
{t:"big",h:"What is Hachiko really about?",body:`<p class="big">The <b>topic</b> of the story is loyalty. A <b>theme</b> is what the author shows us ABOUT loyalty, written as a full sentence that could apply to anyone.</p>
<div class="callout">💛 <b>Possible theme:</b> True loyalty and love can last even after a loved one is gone.</div>
<p>The theme isn’t stated in one sentence. It is <b>implied</b> and builds across the beginning, middle, and end.</p>`},
{t:"table",h:"Tracking the theme",head:["Part of the story","Evidence","How it builds the theme"],
rows:[["Beginning (¶ 7)","Hachiko walks Dr. Ueno to the station and waits every afternoon.","Shows a strong, daily bond."],
["Middle (¶ 17, 22)","Hachiko runs miles back to the station and keeps Dr. Ueno’s routine.","Loyalty continues even after Dr. Ueno dies."],
["End (¶ 25–26, 31)","Hachiko waits for years and dies “still waiting”; his statue brings people together.","Loyalty lasts a lifetime and inspires others."]]},
{t:"check",h:"Quick Check",q:"Which is a THEME statement, not just a topic?",
opts:["Love and loyalty can last even after a loved one is gone.","Loyalty","Hachiko waits at Shibuya Station.","Dogs and trains"],
miss:{1:"That’s a topic. A theme is a full sentence that says something about it.",2:"That’s a plot event. A theme is a lesson for ANY reader.",3:"Those are topics, not a message about life."},
why:"It is a complete sentence about life that applies beyond this one story."},
{t:"watch",h:"Watch out for these traps",items:[
["Picking a one-word topic (“loyalty”).","A theme is a complete sentence with a message."],
["Picking a plot summary.","“Hachiko waits at the station” is what happens, not the lesson."],
["Using a character’s name in the theme.","Themes are universal: “People…”, “True loyalty…”"]]}
],

/* ================= LOCK 3: POINT OF VIEW ================= */
{id:"hk3",code:"ELA.6.R.1.3",icon:"👦",name:"Kentaro’s Eyes",skill:"How the narrator’s point of view shapes the story",
remember:"Hachiko is told in first person by Kentaro. We feel his emotions and grow up with him, but, like him, we can never know what Hachiko is thinking.",
lesson:[
{t:"big",h:"Who tells Hachiko’s story?",body:`<p class="big">The story is told in <b>first person</b> by <b>Kentaro</b>, a boy who meets Hachiko when he is six years old.</p>
<p>Clue: the narration uses <b>I, me, my</b>: “When <b>I</b> was six years old, <b>my</b> family moved…”</p>
<div class="callout">👦 Because Kentaro is the narrator, we only know what HE sees, hears, thinks, and feels. We never get inside Hachiko’s head, or Dr. Ueno’s.</div>`},
{t:"steps",h:"Strategy: Ask 3 POV questions",steps:[
["Who is telling?","Kentaro, using “I.”"],
["What can he know?","His own feelings and what people tell him."],
["What can’t he know?","What Hachiko thinks or feels. That stays a mystery!"]]},
{t:"check",h:"Quick Check",q:"Which sentence shows the story is told in first person?",
opts:["“When I was six years old, my family moved to a little house in Tokyo.”","“Hachiko stood wagging his tail next to Dr. Ueno.”","“People began collecting money to build a statue.”","“The big bronze statue of Hachiko is a very famous meeting place.”"],
miss:{1:"This sentence uses no first-person pronouns. Look for “I” or “my.”",2:"No “I” or “my” in this one either.",3:"This sentence doesn’t show who is telling the story."},
why:"“I” and “my” in the narration show that Kentaro is telling his own story."},
{t:"watch",h:"Watch out for these traps",items:[
["Thinking the narrator is the author.","Kentaro is a character. Pamela S. Turner is the author."],
["Thinking the narrator knows everything.","Kentaro can only guess what Hachiko feels, and so can we."],
["Naming the POV without explaining its effect.","Explain how the POV makes readers feel or what it keeps hidden."]]}
],

miss:{1:"Kentaro is “stunned” and fighting tears. He cares a lot.",2:"Kentaro tells it from his OWN point of view. We never hear Hachiko’s thoughts.",3:"The news is told through Kentaro’s emotions, not like a news report."},

{dok:3,q:"Kentaro is six at the start of the story and much older by the end. What is the effect of having a narrator who grows up during the story?",
opts:["Readers experience the passing years through someone who loves Hachiko, which shows how long Hachiko waited.","Readers learn exactly what Hachiko thinks and feels at each age, from a young puppy to a stiff, old dog.","Readers get confused because the narrator keeps changing from Kentaro to other characters.","Readers find out that the story takes place over just a few days at the station."],

/* ================= LOCK 4: VOCABULARY ================= */
{id:"hk4",code:"ELA.6.V.1.3",icon:"🔍",name:"Word Detective",skill:"Using context clues to find word meanings",
remember:"Look around the word. What is the character doing or feeling? Use those clues, then plug your meaning back into the sentence to check.",
lesson:[
{t:"big",h:"Context clues crack the code",body:`<p class="big">When you meet a tricky word, the sentences around it often hold <b>clues</b>.</p>
<p>In paragraph 6, Kentaro asks a question <b>timidly</b>, and then he “grabbed Mama’s kimono and stepped behind her.” Hiding behind his mother tells us <i>timidly</i> means <b>in a shy or fearful way</b>.</p>
<div class="callout">🔍 <b>Ask:</b> What is the character doing? How do they feel? Does my meaning make sense if I plug it in?</div>`},
{t:"terms",h:"Words from the story",items:[["timidly","in a shy or fearful way","😟"],["anxiously","in a worried, uneasy way","😰"],["patiently","calmly, without complaining","⏳"],["thoughtfully","with careful thinking","🤔"],["silently","without making a sound","🤫"],["morsel","a small bite of food","🍙"]]},
{t:"watch",h:"Watch out for these traps",items:[
["Guessing from the word’s look alone.","Always check the clues in the sentence."],
["Choosing a meaning that doesn’t fit the character’s mood.","If Kentaro is worried, the word probably describes worry."],
["Forgetting connotation.","Authors pick words for their feeling, too: “shuffled” feels different from “walked.”"]]}
],

questions:[
{dok:1,excerpt:`“What is your dog’s name?” I asked <b>timidly</b>. … I grabbed Mama’s kimono and stepped behind her, just in case. (¶ 6)`,q:"What does <b>timidly</b> mean?",
opts:["in a shy or fearful way","in a loud and excited way","in an angry, impatient way","in a silly, joking way"],

hint:"What does Kentaro do right after he asks?",why:"Kentaro hides behind Mama “just in case,” which shows he is shy and afraid. Timidly means in a shy or fearful way."},
{dok:1,excerpt:`“What’s the matter, Papa?” I asked him <b>anxiously</b>. (¶ 13) The moment I saw Papa, I knew something was wrong. (¶ 12)`,q:"What does <b>anxiously</b> mean?",
opts:["in a worried, uneasy way","in a calm, relaxed way","in a proud, happy way","in a sleepy, bored way"],
miss:{1:"Kentaro knows “something was wrong.” He isn’t calm.",2:"Nothing to be proud of here. Papa looks very sad.",3:"Kentaro is alert and worried, not bored."},
hint:"How would you feel if you knew something was wrong?",why:"Kentaro senses something is wrong, so he asks in a worried, uneasy way."},
{dok:2,excerpt:`A few days later he was back at Shibuya Station, <b>patiently</b> waiting, his brown eyes fixed on the entrance. (¶ 17)`,q:"Which clue BEST helps the reader understand <b>patiently</b>?",
opts:["“his brown eyes fixed on the entrance”","“A few days later he was back”","“back at Shibuya Station”","“he was back at Shibuya Station”"],
miss:{1:"This tells WHEN, but not HOW Hachiko waits.",2:"This tells WHERE he waits, not how.",3:"This tells that he returned, not how he waits."},
hint:"Which phrase describes the WAY Hachiko waits?",why:"Keeping his eyes “fixed on the entrance” shows calm, steady waiting without giving up, which is what patiently means."},
{dok:2,excerpt:`The old man’s hair was streaked with gray, and he was <b>stooped</b>, as if he had spent most of his life bent over the ground. (¶ 18)`,q:"What does <b>stooped</b> most likely mean?",
opts:["bent forward at the back and shoulders","standing very tall and straight","walking very quickly with long, fast steps","kneeling down to pray"],
miss:{1:"The clue says “bent over,” which is the opposite of straight.",2:"Nothing describes his speed. The clue is about his body’s shape.",3:"He is standing and filling a bowl, not kneeling."},
hint:"Find the words “bent over” in the same sentence.",why:"The clue “as if he had spent most of his life bent over the ground” shows stooped means bent forward."},
{dok:3,excerpt:`Mr. Kobayashi said <b>thoughtfully</b>, “I don’t know, Kentaro. Perhaps he still hopes that Dr. Ueno will return someday. Or perhaps he knows Dr. Ueno is dead, but he waits at the station to honor his master’s memory.” (¶ 24)`,q:"How does Mr. Kobayashi’s answer show what <b>thoughtfully</b> means?",
opts:["He carefully considers two possible reasons instead of giving a quick answer.","He answers quickly and confidently because he knows the right answer.","He refuses to answer because the question makes him feel angry and upset.","He laughs and changes the subject to talk about his garden."],
miss:{1:"He says “I don’t know” and gives two possibilities. That isn’t quick or certain.",2:"He does answer, kindly and carefully. He isn’t angry.",3:"He doesn’t laugh or change the subject. He takes the question seriously."},
hint:"Count the words “Perhaps” in his answer.",why:"He weighs two possible explanations (“Perhaps… Or perhaps…”), which shows careful thinking. That is what thoughtfully means."},
{dok:3,excerpt:`Old Mr. Kobayashi was there. He <b>shuffled</b> over to me and put a hand on my shoulder. (¶ 28)`,q:"Why does the author use <b>shuffled</b> instead of a word like <i>walked</i>?",
opts:["It shows he moves slowly, dragging his feet, which fits his old age and the sad mood.","It shows he is running excitedly across the station to share good news with Kentaro.","It shows he is dancing to celebrate Hachiko’s statue.","It shows he is sneaking up to surprise Kentaro as a joke."],

]},

["Picture the scene.","What is happening in that paragraph?"],
["Find the clue.","Look for an example, an opposite, or a describing word nearby."],
["Check it.","Replace the word with your meaning. Does the sentence still make sense?"]]}
],
passage:null,
questions:[
{dok:1,excerpt:`I wondered if the dog was a <b>stray</b>, but he was wearing a nice leather harness and looked healthy and strong. (¶ 2)`,q:"What does <b>stray</b> mean?",
opts:["a pet that is lost or has no home","a dog that is very well trained","a puppy that belongs to a family","a dog that works at a train station"],
miss:{1:"Training isn’t mentioned. The clue is about whether someone cares for him.",2:"The word “but” shows a stray is the OPPOSITE of a cared-for pet.",3:"Nothing suggests Hachiko has a job at the station."},
hint:"The word “but” signals a contrast. What is the opposite of a healthy dog wearing a nice harness?",why:"The contrast with “but he was wearing a nice leather harness and looked healthy” shows a stray is a homeless or lost pet."},
{dok:1,excerpt:`He was wearing a nice leather <b>harness</b>. (¶ 2)`,q:"What is a <b>harness</b>?",
opts:["a set of straps that fits around an animal’s body","a soft, thick blanket for a dog to sleep on at night","a bowl for an animal’s food and water","a small house where a dog can live"],
miss:{1:"You “wear” a harness, but you don’t wear a blanket.",2:"A bowl isn’t something a dog wears.",3:"A doghouse isn’t worn, and a harness is made of leather straps."},
hint:"The dog is WEARING it, and it’s made of leather.",why:"Hachiko is “wearing” it and it is leather, so a harness is a set of straps around an animal’s body."},
{dok:2,excerpt:`The dog bounded over to the man, his entire body wiggling and <b>quivering</b> with delight. (¶ 4)`,q:"What does <b>quivering</b> mean, and what does it show about Hachiko?",
opts:["shaking with small, quick movements; he is thrilled to see Dr. Ueno","standing very still; he is scared of Dr. Ueno","growling quietly; he is angry and upset with Dr. Ueno for leaving","lying down slowly; he is tired from waiting"],
miss:{1:"He “bounded” over. That is the opposite of standing still.",2:"The clue “with delight” shows happiness, not anger.",3:"Bounding and wiggling show energy, not tiredness."},
hint:"Look at “wiggling” and “with delight” in the same sentence.",why:"“Wiggling” and “with delight” show quivering means shaking with excitement. Hachiko is overjoyed to see Dr. Ueno."},
{dok:2,excerpt:`I often saved a <b>morsel</b> from my lunch and hid it in one of my pockets. (¶ 10) … until he found a sticky bit of fish or soybean cake. (¶ 11)`,q:"Which clue from paragraph 11 BEST helps you know what a <b>morsel</b> is?",
opts:["“a sticky bit of fish or soybean cake”","“wagging his tail”","“nudge me with his nose, as if to say”","“When it was cold, I would bury my face”"],
miss:{1:"Wagging shows Hachiko is happy, not what a morsel is.",2:"This shows how Hachiko asks for the treat, not what the treat is.",3:"This tells when something happened, not what a morsel is."},
hint:"What does Hachiko find in Kentaro’s pocket?",why:"The “sticky bit of fish or soybean cake” is the morsel Kentaro hid, so a morsel is a small piece of food."},
{dok:3,excerpt:`When it was cold, I would bury my face in the thick <b>ruff</b> of creamy fur around his neck. (¶ 11)`,q:"Using context, what is a <b>ruff</b>, and what does this detail show about Kentaro and Hachiko?",
opts:["a thick ring of fur around the neck; it shows how close and comfortable they are together","a loud bark; it shows that Hachiko protects Kentaro from danger","a rough leather collar; it shows that Hachiko belongs to Dr. Ueno and his family","a cold wind; it shows that Kentaro doesn’t like winter at the station"],
miss:{1:"The sentence says “ruff of creamy fur,” so it’s fur, not a sound.",2:"It’s made of “creamy fur,” not leather.",3:"The cold is mentioned separately. The ruff is part of Hachiko."},
hint:"The sentence tells you what the ruff is made of and where it is.",why:"A ruff is the “thick… creamy fur around his neck.” Burying his face in it shows deep trust and affection between Kentaro and Hachiko."},
{dok:3,excerpt:`“What’s wrong?” I asked as I stumbled into the kitchen. Papa sat <b>silently</b> at the table, and Mama turned her tear-stained face to me. (¶ 26)`,q:"Why does the author have Papa sit <b>silently</b>?",
opts:["His silence shows the news is so sad that he can’t find words.","His silence shows he is angry that Kentaro woke up late.","His silence shows he is busy reading the morning newspaper.","His silence shows he doesn’t care about what happened."],
miss:{1:"Nothing suggests anger. Mama is crying, so this is grief.",2:"No newspaper is mentioned. Focus on the family’s feelings.",3:"Papa gave money for the statue (¶ 25). He cares about Hachiko."},
hint:"Mama is crying. What might Papa’s silence mean?",why:"Silently means without sound. Papa’s silence, next to Mama’s tears, shows the family’s grief over Hachiko’s death."}
]},

/* ================= LOCK 5: WORD PICTURES ================= */
{id:"hk5",code:"ELA.6.R.3.1",icon:"🎨",name:"Word Pictures",skill:"How figurative language and word choice create tone and meaning",
remember:"Turner’s word pictures (joy that is “stored up,” eyes “as sharp and bright as Hachiko’s,” a “tear-stained face”) help readers feel the story’s tone, from joyful to heartbroken to hopeful.",
lesson:[
{t:"big",h:"Painting with words",body:`<p class="big">Pamela S. Turner uses <b>figurative language</b> and careful <b>word choice</b> to help us SEE and FEEL the story.</p>
<ul><li><b>Simile:</b> compares using <i>like</i> or <i>as</i>. His mouth curled into something “just like a smile.”</li><li><b>Metaphor:</b> describes one thing as if it were another. Hachiko “stores up all his joy.”</li><li><b>Imagery:</b> details that appeal to the senses, like a “tear-stained face” on a “chilly morning.”</li></ul>
<div class="callout">🎨 Ask: What does this make me picture? How does it make me feel? That feeling is the <b>tone</b>.</div>`},
{t:"check",h:"Quick Check",q:"“His eyes were as sharp and bright as Hachiko’s.” (¶ 18) What kind of figurative language is this?",
opts:["Simile","Hyperbole","Onomatopoeia","Alliteration"],
miss:{1:"Hyperbole is a huge exaggeration. This is a comparison.",2:"Onomatopoeia is a sound word like “buzz.”",3:"Alliteration repeats beginning sounds."},
why:"It compares Mr. Kobayashi’s eyes to Hachiko’s using “as,” so it’s a simile."},
{t:"watch",h:"Watch out for these traps",items:[
["Taking figurative language literally.","Hachiko can’t really put joy in a box. Translate it!"],
["Naming the device without explaining its effect.","Say what it shows and how it makes the reader feel."],
["Ignoring the tone shift.","The story moves from joyful, to sad, to hopeful. Notice where it changes."]]}
],
passage:null,
questions:[
{dok:1,excerpt:`“I think Hachiko stores up all his joy, all day long, and then lets it all out at once!” (¶ 7)`,q:"What does Dr. Ueno mean?",
opts:["Hachiko saves up his happiness all day and shows it all when Dr. Ueno comes home.","Hachiko hides his treats in a special secret place at the station all day long.","Hachiko is a sad, lonely dog who is never excited about anything.","Hachiko barks loudly at the trains all day long."],
miss:{1:"Dr. Ueno is talking about feelings (“joy”), not treats.",2:"The opposite! Hachiko lets out a LOT of joy.",3:"Nothing here is about barking at trains."},
hint:"What happens when Dr. Ueno returns each afternoon (¶ 4)?",why:"Joy can’t really be “stored,” so this is figurative. It means Hachiko waits all day and bursts with happiness when Dr. Ueno comes home."},
{dok:1,excerpt:`His eyes shone, and his mouth curled up into something that looked, to me, just like a smile. (¶ 4)`,q:"Which type of figurative language is “just like a smile”?",
opts:["Simile","Metaphor","Hyperbole","Idiom"],
miss:{1:"A metaphor compares without “like” or “as.” Look for “like” here.",2:"This isn’t an exaggeration. It’s a comparison.",3:"An idiom is a common saying. This compares Hachiko’s mouth to a smile."},
hint:"Look for the word “like.”",why:"It compares Hachiko’s expression to a human smile using “like,” so it is a simile."},
{dok:2,excerpt:`The old man’s hair was streaked with gray, and he was stooped, as if he had spent most of his life bent over the ground. (¶ 18)`,q:"What does this description suggest about Mr. Kobayashi?",
opts:["He has worked hard for many years, probably as a gardener.","He is a young man who likes to look at bugs.","He has been searching the ground for something he lost.","He is too tired to take care of Hachiko anymore."],
miss:{1:"His gray hair tells you he is old, not young.",2:"“As if” shows a comparison about his posture, not a real search.",3:"He is filling Hachiko’s water bowl, so he IS caring for him."},
hint:"What job does Mr. Kobayashi say he had in paragraph 19?",why:"“Bent over the ground” suggests years of hard work. It fits his job as Dr. Ueno’s gardener (¶ 19)."},
{dok:2,excerpt:`But his eyes were as sharp and bright as Hachiko’s. (¶ 18)`,q:"Why does the author compare Mr. Kobayashi’s eyes to Hachiko’s?",
opts:["To show that, like Hachiko, he is old but still alert and loyal","To show that Mr. Kobayashi is about to become Hachiko’s owner","To show that Mr. Kobayashi is angry and suspicious of Kentaro","To show that Hachiko and Mr. Kobayashi look exactly alike"],
miss:{1:"He never becomes the owner. Hachiko keeps waiting for Dr. Ueno.",2:"Mr. Kobayashi is kind to Kentaro (¶ 19–24). He isn’t angry.",3:"A simile compares one quality, not their whole appearance."},
hint:"What do Hachiko and Mr. Kobayashi have in common in this story?",why:"The simile links them: both are aging but still sharp, and both stay loyal to Dr. Ueno."},
{dok:3,excerpt:`One chilly morning I woke to the sound of Mama crying. … Papa sat silently at the table, and Mama turned her tear-stained face to me. (¶ 26)`,q:"How does the author’s word choice create the tone of this paragraph?",
opts:["Words like “chilly,” “crying,” “silently,” and “tear-stained” create a sad, heavy tone.","Words like “chilly,” “kitchen,” and “table” create a cheerful, cozy, warm tone.","Words like “Mama” and “Papa” create a funny, playful tone.","The word choice creates no tone because it only gives facts."],
miss:{1:"“Chilly” is cold, and the crying makes it sad, not cheerful.",2:"Family names alone don’t create humor, and nothing is funny here.",3:"Every word here adds feeling. The cold, the tears, and the silence all signal grief."},
hint:"List the feeling words. What do they have in common?",why:"Cold weather, crying, silence, and tears all build a sad, heavy tone as the family learns that Hachiko has died."},
{dok:3,excerpt:`Today Hachiko is a place where friends and family long separated come together again. (¶ 31)`,q:"How does this final sentence affect the tone of the ending?",
opts:["It adds hope: Hachiko waited for a reunion that never came, but now his statue brings other people together.","It makes the ending more frightening by warning readers about the crowded train station.","It makes the ending silly by joking that people always get lost in the huge, crowded Shibuya Station.","It makes the ending angrier by blaming Dr. Ueno’s relatives for Hachiko’s sadness."],
miss:{1:"Nothing in the sentence is a warning. It describes reunions.",2:"The sentence is sincere, not a joke.",3:"No one is blamed. The sentence is about people coming together."},
hint:"Hachiko waited for someone who never came back. What happens at his statue now?",why:"The story ends bittersweet but hopeful. Hachiko never got his reunion, but his statue now helps “friends and family long separated come together again.”"}
]}
]};

<script>
(function(){
"use strict";
const T = window.TUTORIAL;
const LOGO = window.LOGO_SRC || "";
const KEY = "literacy-locksmith-fast6-" + T.id + "-v1";
const $ = s => document.querySelector(s);
const app = $("#app");
document.documentElement.style.setProperty("--accent", T.theme.accent);
document.documentElement.style.setProperty("--accent2", T.theme.accent2);
document.documentElement.style.setProperty("--accentbg", T.theme.accentbg);

/* ---------- autosave (stays on this iPad) ---------- */
function fresh(){return {name:"",xp:0,streak:0,best:0,dok3:0,badges:[],locks:{},view:"home",lock:null,step:"learn",sound:true,slow:false,vaultOpen:false};}
function load(){try{const r=localStorage.getItem(KEY);if(!r)return null;return Object.assign(fresh(),JSON.parse(r));}catch(e){return null;}}
let S = load() || fresh();
let savedTimer=null;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  const el=$("#saved"); if(el){el.classList.add("on");clearTimeout(savedTimer);savedTimer=setTimeout(()=>el.classList.remove("on"),1600);}
}
function LS(id){return S.locks[id]||(S.locks[id]={card:0,learned:false,q:0,ans:{},tc:{},done:false,key:null,first:0,retake:false,noHint:true});}
function lockById(id){return T.locks.find(l=>l.id===id);}

/* ---------- helpers ---------- */
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function order(seed,n){const a=[...Array(n).keys()];let h=hash(seed);for(let i=n-1;i>0;i--){h=Math.imul(h^(h>>>15),2246822507)>>>0;h=(h+0x9e3779b9)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const LET="ABCD";
const LEVELS=[[0,"Key Finder"],[100,"Apprentice Locksmith"],[250,"Junior Locksmith"],[450,"Locksmith"],[700,"Master Locksmith"],[1000,"Vault Legend"]];
function level(){let i=0;LEVELS.forEach((l,k)=>{if(S.xp>=l[0])i=k;});const cur=LEVELS[i],nxt=LEVELS[i+1];const pct=nxt?Math.round((S.xp-cur[0])/(nxt[0]-cur[0])*100):100;return {name:cur[1],num:i+1,pct,next:nxt?nxt[0]:null};}
const BADGES=[
 ["first","🔑","First Key","Finish any lock"],
 ["fire","🔥","On Fire","5 first-try answers in a row"],
 ["solo","🧠","Solo Solver","Finish a lock with no Key Clues"],
 ["flaw","💎","Flawless","Every answer right on the first try in a lock"],
 ["owl","🦉","Deep Thinker","5 DOK 3 questions right on the first try"],
 ["books","📚","Lesson Lover","Finish every lesson"],
 ["gold3","🏆","Gold Collector","Earn 3 gold keys"],
 ["vault","👑","Vault Master","Open the vault"]
];
const KEYCOL={gold:["#f5b70a","#ffe08a"],silver:["#9aa3b5","#e3e7ef"],bronze:["#c26a2c","#f2b98a"]};
function keySVG(type,size){const c=type?KEYCOL[type]:["#c9cbd6","#eceef4"];size=size||40;
 return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true"><circle cx="20" cy="22" r="14" fill="${c[0]}" stroke="#16244f" stroke-width="3"/><circle cx="20" cy="22" r="6" fill="${c[1]}" stroke="#16244f" stroke-width="3"/><path d="M30 30 L54 54 M44 44 L50 38 M50 50 L56 44" stroke="#16244f" stroke-width="9" stroke-linecap="round"/><path d="M30 30 L54 54 M44 44 L50 38 M50 50 L56 44" stroke="${c[0]}" stroke-width="5" stroke-linecap="round"/></svg>`;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toast(msg){const t=$("#toast");t.innerHTML=msg;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2600);}
function addXP(n,why){if(n<=0)return;S.xp+=n;if(why)toast(`⭐ +${n} XP · ${why}`);}
function award(id){if(S.badges.includes(id))return;S.badges.push(id);const b=BADGES.find(x=>x[0]===id);setTimeout(()=>{toast(`${b[1]} New badge: <b>${b[2]}</b>!`);sfx("key");},900);}

/* ---------- sound effects ---------- */
let AC=null;
function sfx(type){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
 const seq={good:[[660,0],[880,.09],[1320,.18]],bad:[[300,0],[240,.13]],key:[[523,0],[659,.1],[784,.2],[1047,.32]],tap:[[620,0]]}[type]||[];
 seq.forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type==="bad"?"sine":"triangle";o.frequency.value=f;const st=AC.currentTime+t;g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(type==="bad"?.08:.14,st+.02);g.gain.exponentialRampToValueAtTime(.0001,st+.2);o.connect(g);g.connect(AC.destination);o.start(st);o.stop(st+.22);});}catch(e){}}

/* ---------- read aloud (Google US English voice) ---------- */
const TTS={voice:null,btn:null,queue:[],
 pick(){if(!("speechSynthesis" in window))return;const vs=speechSynthesis.getVoices();
   this.voice=vs.find(v=>v.name==="Google US English")||vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Ava|Allison|Susan|Zira|Jenny|Aria|Nicky/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||null;},
 clean(t){return t
   .replace(/ELA\.\d+\.[A-Z]+(\.\d+)*/g,"")
   .replace(/\bDOK\s*\d\b/g,"")
   .replace(/\/([a-zA-Z]{1,3})\//g," $1 sound ")
   .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{2190}-\u{21FF}\u{2300}-\u{23FF}]/gu,"")
   .replace(/[•·▶→←]/g," ").replace(/\s+/g," ").trim();},
 chunks(t){const parts=t.match(/[^.!?]+[.!?"”’)]*\s*/g)||[t];const out=[];let cur="";parts.forEach(p=>{if((cur+p).length>220&&cur){out.push(cur);cur=p;}else cur+=p;});if(cur.trim())out.push(cur);return out;},
 stop(){try{speechSynthesis.cancel();}catch(e){}this.queue=[];if(this.btn){this.btn.classList.remove("on");this.btn.innerHTML=this.btn.dataset.label;}this.btn=null;},
 speak(text,btn){
   if(!("speechSynthesis" in window)){toast("Read-aloud is not available on this device.");return;}
   const same=this.btn===btn&&btn;this.stop();if(same)return;
   if(!this.voice)this.pick();
   this.btn=btn;if(btn){btn.dataset.label=btn.dataset.label||btn.innerHTML;btn.classList.add("on");btn.innerHTML="⏹ Stop";}
   this.queue=this.chunks(this.clean(text));this.next();},
 next(){if(!this.queue.length){this.stop();return;}const u=new SpeechSynthesisUtterance(this.queue.shift());
   if(this.voice){u.voice=this.voice;u.lang=this.voice.lang;}else u.lang="en-US";
   u.rate=S.slow?0.8:0.95;u.pitch=1;u.onend=()=>{if(this.btn)this.next();};u.onerror=()=>this.stop();speechSynthesis.speak(u);}
};
if("speechSynthesis" in window){TTS.pick();speechSynthesis.onvoiceschanged=()=>TTS.pick();}
function textOf(el){const c=el.cloneNode(true);c.querySelectorAll("[data-nosay]").forEach(x=>x.remove());c.querySelectorAll(".flip .front").forEach(x=>x.remove());c.querySelectorAll(".flip .back").forEach(x=>{x.style.display="block";});c.querySelectorAll("p,li,h3,h4,div,tr,td,th,br").forEach(x=>x.insertAdjacentText("afterend"," . "));return c.textContent.replace(/(\s*\.\s*){2,}/g,". ");}

/* ---------- confetti ---------- */
function confetti(n){n=n||170;const c=$("#confetti"),x=c.getContext("2d");const W=c.width=innerWidth,H=c.height=innerHeight;
 const cols=["#f5b70a","#ff5fa2","#3ec1d3","#7b3fe4","#22c55e","#ff8c42","#2563eb"];
 const ps=[...Array(n)].map((_,i)=>({x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*5,vy:2+Math.random()*4,r:Math.random()*6.3,vr:(Math.random()-.5)*.35,w:7+Math.random()*7,h:9+Math.random()*9,c:cols[i%cols.length]}));
 const t0=performance.now();(function f(t){x.clearRect(0,0,W,H);let alive=false;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.r+=p.vr;if(p.y<H+30)alive=true;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});if(alive&&t-t0<6000)requestAnimationFrame(f);else x.clearRect(0,0,W,H);})(t0);}

/* ---------- top bar ---------- */
function keysEarned(){return T.locks.filter(l=>S.locks[l.id]&&S.locks[l.id].done).length;}
function topbar(){const lv=level();
 const logo=LOGO?`<img src="${LOGO}" alt="The Literacy Locksmith logo">`:`<div class="wordmark">The Literacy<b>LOCKSMITH</b></div>`;
 return `<header class="top noprint"><div class="wrap">
  <div class="brand">${logo}<div class="ttl">${esc(T.short)}</div></div>
  <div class="stats">
   <span class="saved" id="saved">✔ Saved on this iPad</span>
   <span class="chip gold" title="Experience points">⭐ ${S.xp} XP</span>
   <span class="chip" title="Keys earned">🔑 ${keysEarned()}/${T.locks.length}</span>
   <span class="chip" title="First-try streak">🔥 ${S.streak}</span>
   <button class="ibtn" data-act="slow" title="Read-aloud speed">${S.slow?"🐢 Slow":"🐇 Normal"}</button>
   <button class="ibtn" data-act="sound" title="Sound effects">${S.sound?"🔔 On":"🔕 Off"}</button>
  </div>
  <div class="lvlrow"><span>Lv ${lv.num} · ${lv.name}</span><div class="xpbar"><i style="width:${lv.pct}%"></i></div><span>${lv.next?(lv.next-S.xp)+" XP to next level":"MAX LEVEL!"}</span></div>
 </div></header>`;}
function footer(){return `<footer class="noprint">🔐 The Literacy Locksmith · Created and copyrighted by Donna Rees<br>Aligned to the Florida B.E.S.T. ELA Standards, Grade 6 · ${esc(T.title)}<br><button data-act="reset">Teacher: reset this device</button></footer>`;}

/* ---------- HOME ---------- */
function home(){
 const allDone=T.locks.every(l=>S.locks[l.id]&&S.locks[l.id].done);
 const greet=S.name?`<p class="big"><b>Welcome back, ${esc(S.name)}!</b> Your progress is saved right here on this iPad. Pick a lock below to keep going.</p>`:
 `<p>Type your first name so your certificate knows who you are:</p><div class="namebox"><input id="nm" maxlength="24" placeholder="First name" autocomplete="off"><button class="btn" data-act="name">Let's go! 🚀</button></div>`;
 let h=`<section class="hero"><div class="card" id="intro"><span class="kicker">${esc(T.kicker)}</span><h1>${esc(T.title)}</h1>
  <p>${T.intro}</p>${greet}
  <div class="qtools" data-nosay><button class="say" data-say="#intro">🔊 Read to me</button></div></div>
  <div class="card howto" id="how"><h3>🗝️ How to Unlock the Vault</h3><ul>
   <li><span>📘</span><b>Learn It:</b> Read (or listen to) the lesson cards. Tap the flip cards and try the Quick Checks.</li>
   <li><span>🎯</span><b>Prove It:</b> Answer FAST-style questions at DOK 1, 2, and 3.</li>
   <li><span>🔧</span><b>Wrong answer?</b> You'll see WHY it's a trap, then try again. First try = 10 XP, second = 5, third = 2.</li>
   <li><span>🔑</span><b>Key Clues</b> give a hint but cost 3 XP.</li>
   <li><span>🥇</span>Earn a <b>gold, silver, or bronze key</b> for each lock. Collect them all to open the vault!</li>
  </ul></div></section>`;
 h+=`<div class="sect"><h2>🔒 The Locks</h2><span class="sub">${T.locks.length} skills in this category · tap any lock to start</span></div><div class="grid">`;
 T.locks.forEach((l,i)=>{const st=S.locks[l.id];let pill=`<span class="pill new">New</span>`;
  if(st&&st.done)pill=`<span class="pill done">Unlocked · ${st.key} key</span>`;else if(st&&(st.card>0||st.q>0||st.learned))pill=`<span class="pill go">In progress</span>`;
  h+=`<button class="lockc" data-act="open" data-id="${l.id}"><span class="keyabs">${keySVG(st&&st.done?st.key:null,34)}</span><span class="ic">${l.icon}</span><span class="code">Lock ${i+1} · ${l.code}</span><h3>${esc(l.name)}</h3><span class="sk">${esc(l.skill)}</span><span class="st">${pill}</span></button>`;});
 h+=`</div>`;
 if(allDone)h+=`<div class="card vaultcta"><h2>🏦 Every lock is open!</h2><p>You collected all ${T.locks.length} keys. The vault is waiting...</p><button class="btn gold" data-act="vault">Open the Vault 🔓</button></div>`;
 h+=`<div class="sect"><h2>🏅 Badges</h2><span class="sub">${S.badges.length}/${BADGES.length} earned</span></div><div class="badges">`;
 BADGES.forEach(b=>{h+=`<div class="badge ${S.badges.includes(b[0])?"":"lock"}"><span class="e">${b[1]}</span><span>${b[2]}<small>${b[3]}</small></span></div>`;});
 h+=`</div>`;return h;}

/* ---------- LESSON ---------- */
function cardHTML(c,l,ci){let b="";
 switch(c.t){
  case "big":b=c.body;break;
  case "terms":b=`<p>${c.intro||"Tap each card to flip it and reveal the meaning."}</p><div class="terms">${c.items.map(t=>`<div class="term flip" data-act="flip"><div class="front">${t[2]||""} ${t[0]}<small>tap to flip</small></div><div class="back"><b>${t[0]}</b><span>${t[1]}</span></div></div>`).join("")}</div>`;break;
  case "steps":b=(c.intro?`<p>${c.intro}</p>`:"")+`<ol class="stepl">${c.steps.map(s=>`<li><b>${s[0]}</b><br>${s[1]}</li>`).join("")}</ol>`+(c.after||"");break;
  case "example":b=(c.intro?`<p>${c.intro}</p>`:"")+`<div class="ex">${c.text}</div><p><b>Watch how a strong reader thinks:</b></p><ul class="think">${c.think.map(x=>`<li><span>${x}</span></li>`).join("")}</ul>`+(c.after?`<div class="callout green">${c.after}</div>`:"");break;
  case "watch":b=`<p>${c.intro||"These are the traps test makers love. Don't fall for them!"}</p>`+c.items.map(m=>`<div class="myth"><div class="m"><b>❌ TRAP</b>${m[0]}</div><div class="f"><b>✅ FIX</b>${m[1]}</div></div>`).join("");break;
  case "table":b=(c.intro?`<p>${c.intro}</p>`:"")+`<div class="tablewrap"><table class="t"><tr>${c.head.map(x=>`<th>${x}</th>`).join("")}</tr>${c.rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table></div>`+(c.after||"");break;
  case "check":{const st=LS(l.id).tc[ci]||{wrong:[],ok:false};const ord=order(l.id+"tc"+ci,c.opts.length);
   b=(c.text?`<div class="ex">${c.text}</div>`:"")+`<p class="qtext">${c.q}</p><div class="opts">`+ord.map((o,i)=>{const cls=st.ok&&o===0?"right":st.wrong.includes(o)?"wrong":st.ok?"dim":"";return `<button class="opt ${cls}" data-act="tc" data-ci="${ci}" data-o="${o}"><span class="L">${LET[i]}</span><span>${c.opts[o]}</span></button>`;}).join("")+`</div>`;
   if(st.ok)b+=`<div class="fb good"><h4>✅ Nice! ${st.wrong.length===0?"+5 XP":""}</h4>${c.why}</div>`;
   else if(st.wrong.length){const last=st.wrong[st.wrong.length-1];b+=`<div class="fb bad"><h4>🔧 Not quite — fix the thinking</h4>${c.miss&&c.miss[last]?c.miss[last]:"Look back at the lesson and try again."}</div>`;}
   break;}
  default:b=c.body||"";}
 return `<div class="card lcard" id="lc"><div class="chead"><span class="tag" data-nosay>${c.tag||({big:"Big Idea",terms:"Key Words",steps:"Strategy",example:"Model",watch:"Watch Out!",table:"Know It",check:"Quick Check"}[c.t]||"Lesson")}</span><h3>${c.h}</h3><button class="say" data-say="#lc" data-nosay>🔊 Read to me</button></div><div class="cbody">${b}</div></div>`;}
function lockHead(l,step){const st=LS(l.id);
 const s=(k,label,ok)=>`<button class="stp ${step===k?"on":ok?"ok":""}" data-act="step" data-k="${k}">${label}</button>`;
 return `<div class="lockhead"><button class="btn ghost sm" data-act="home">← Locks</button><span class="ic">${l.icon}</span><div><h2>${esc(l.name)}</h2><div class="code">${l.code} · ${esc(l.skill)}</div></div>
 <div class="steps">${s("learn","📘 Learn It",st.learned)}${s("practice","🎯 Prove It",st.done)}${st.done?s("result","🔑 My Key",true):""}</div></div>`;}
function learn(l){const st=LS(l.id);const n=l.lesson.length;const ci=Math.min(st.card,n-1);const c=l.lesson[ci];
 let h=lockHead(l,"learn")+cardHTML(c,l,ci);
 h+=`<div class="navrow lcard"><button class="btn ghost" data-act="prev" ${ci===0?"disabled":""}>← Back</button><div class="dots">${l.lesson.map((_,i)=>`<span class="dot ${i===ci?"on":i<ci?"g":""}"></span>`).join("")}</div>`;
 h+=ci<n-1?`<button class="btn" data-act="next">Next →</button>`:`<button class="btn gold" data-act="topractice">I'm ready! Prove It 🎯</button>`;
 return h+`</div>`;}

/* ---------- PRACTICE ---------- */
function passageHTML(p){if(!p)return "";const arr=Array.isArray(p)?p:[p];
 return arr.map(x=>`<h3>${x.title}</h3>${x.by?`<div class="src">${x.by}</div>`:""}<div class="ptext">${x.html}</div>`).join("<hr>");}
function practice(l){const st=LS(l.id);const qs=l.questions;
 if(st.q>=qs.length){S.step="result";return result(l);}
 const qi=st.q,q=qs[qi];const a=st.ans[qi]||(st.ans[qi]={wrong:[],ok:false,hint:false,pts:0,rev:false});
 const ord=order(l.id+"q"+qi,q.opts.length);
 const P=q.passage||l.passage;
 let h=lockHead(l,"practice");
 h+=`<div class="prac ${P?"":"solo"}">`;
 if(P)h+=`<div class="card passage" id="psg"><div class="qtop" data-nosay><span class="tag">📖 Read the text</span><button class="say" data-say="#psgt">🔊 Read passage</button></div><div id="psgt">${passageHTML(P)}</div></div>`;
 h+=`<div class="card" id="qcard"><div class="qtop"><span class="qnum">Question ${qi+1} of ${qs.length}</span><span class="dok dok${q.dok}">DOK ${q.dok} · ${["","Recall","Skill & Concept","Strategic Thinking"][q.dok]}</span>${st.retake?`<span class="tag">Retake · no XP</span>`:""}</div>`;
 if(q.excerpt)h+=`<div class="excerpt">${q.excerpt}</div>`;
 h+=`<div class="qtext">${q.q}</div><div class="opts">`;
 ord.forEach((o,i)=>{let cls="";if((a.ok||a.rev)&&o===0)cls="right";else if(a.wrong.includes(o))cls="wrong";else if(a.ok||a.rev)cls="dim";
  h+=`<button class="opt ${cls}" data-act="ans" data-o="${o}"><span class="L">${a.wrong.includes(o)?"✖":(a.ok||a.rev)&&o===0?"✔":LET[i]}</span><span>${q.opts[o]}</span></button>`;});
 h+=`</div>`;
 if(a.ok||a.rev){
  h+=`<div class="fb good"><div class="fbrow"><h4>${a.rev?"🔓 Here's the right answer":"✅ "+(a.wrong.length?"You fixed it!":["Correct!","Nailed it!","Yes! Sharp thinking!","Boom! Right on!"][qi%4])}</h4><span class="pts">${st.retake?"":"+"+a.pts+" XP"}</span></div><p><b>Why it's right:</b> ${q.why}</p></div>`;
  h+=`<div class="navrow"><button class="linkbtn" data-act="step" data-k="learn">📘 Review the lesson</button><button class="btn" data-act="nextq">${qi<qs.length-1?"Next question →":"Finish & get my key 🔑"}</button></div>`;
 }else{
  if(a.wrong.length){const last=a.wrong[a.wrong.length-1];const tries=a.wrong.length;
   h+=`<div class="fb bad"><h4>🔧 Not quite — let's fix the thinking</h4><p>${q.miss&&q.miss[last]?q.miss[last]:"Go back to the text and look for evidence."}</p><p><b>Try again!</b> This try is worth ${[10,5,2,0][Math.min(tries,3)]} XP.</p></div>`;}
  if(a.hint)h+=`<div class="fb hint"><h4>🔑 Key Clue</h4>${q.hint}</div>`;
  h+=`<div class="qtools" data-nosay>${a.hint?"":`<button class="hintbtn" data-act="hint">🔑 Key Clue (−3 XP)</button>`}<button class="say" data-act="sayq">🔊 Read question</button><button class="linkbtn" data-act="step" data-k="learn">📘 Review the lesson</button></div>`;
 }
 h+=`<div class="navrow"><span></span><div class="dots">${qs.map((_,i)=>{const x=st.ans[i];let c="";if(i===qi)c="on";else if(x&&x.ok&&!x.wrong.length)c="g";else if(x&&x.ok)c="y";else if(x&&x.rev)c="r";return `<span class="dot ${c}"></span>`;}).join("")}</div><span></span></div>`;
 return h+`</div></div>`;}
function sayQuestion(l,btn){const st=LS(l.id);const q=l.questions[st.q];const ord=order(l.id+"q"+st.q,q.opts.length);
 const tmp=document.createElement("div");tmp.innerHTML=(q.excerpt?q.excerpt+" . ":"")+q.q;let t=tmp.textContent+". ";
 ord.forEach((o,i)=>{const d=document.createElement("div");d.innerHTML=q.opts[o];t+=` Choice ${LET[i]}: ${d.textContent}. `;});TTS.speak(t,btn);}
function answer(l,o){const st=LS(l.id);const qi=st.q,q=l.questions[qi];const a=st.ans[qi];if(a.ok||a.rev)return;
 if(o===0){a.ok=true;const base=[10,5,2,0][Math.min(a.wrong.length,3)];a.pts=st.retake?0:Math.max(base-(a.hint&&base>0?3:0),base>0?1:0);
  sfx("good");
  if(!st.retake){S.xp+=a.pts;}
  if(a.wrong.length===0){S.streak++;if(S.streak>S.best)S.best=S.streak;if(q.dok===3&&!st.retake){S.dok3++;if(S.dok3>=5)award("owl");}
   if(S.streak>=5)award("fire");if(S.streak%3===0&&!st.retake){S.xp+=5;toast(`🔥 ${S.streak} in a row! Streak bonus +5 XP`);}
   if(S.streak%3!==0&&!st.retake)toast(`⭐ +${a.pts} XP`);}
  else{if(!st.retake)toast(`⭐ +${a.pts} XP · you fixed your thinking!`);}
  if(a.wrong.length===0&&S.streak%3===0)confetti(70);
 }else{a.wrong.push(o);S.streak=0;sfx("bad");
  if(a.wrong.length>=q.opts.length-1){a.rev=true;a.pts=0;}}
 save();render();
 setTimeout(()=>{const f=document.querySelector(".fb");if(f)f.scrollIntoView({behavior:"smooth",block:"nearest"});},60);}

/* ---------- RESULT ---------- */
function finalize(l){const st=LS(l.id);const qs=l.questions;let first=0;qs.forEach((_,i)=>{const a=st.ans[i];if(a&&a.ok&&a.wrong.length===0)first++;});
 const pct=first/qs.length;const key=pct>=.8?"gold":pct>=.5?"silver":"bronze";
 const order3={bronze:1,silver:2,gold:3};
 const hintUsed=qs.some((_,i)=>st.ans[i]&&st.ans[i].hint);
 if(!st.done){st.done=true;st.key=key;st.first=first;addXP(20+(key==="gold"?10:0),"Lock unlocked!");}
 else if(order3[key]>order3[st.key]){st.key=key;st.first=first;toast(`⬆️ Key upgraded to ${key}!`);} else if(first>st.first)st.first=first;
 st.retake=false;
 award("first");if(!hintUsed)award("solo");if(first===qs.length)award("flaw");
 if(T.locks.filter(x=>S.locks[x.id]&&S.locks[x.id].key==="gold").length>=3)award("gold3");
 st.lastFirst=first;st.lastKey=key;st.lastDok=[1,2,3].map(d=>{const idx=qs.map((q,i)=>i).filter(i=>qs[i].dok===d);return [idx.filter(i=>st.ans[i]&&st.ans[i].ok&&!st.ans[i].wrong.length).length,idx.length];});
 save();sfx("key");setTimeout(()=>confetti(),150);}
function result(l){const st=LS(l.id);const qs=l.questions;if(st.lastKey==null){if(st.q>=qs.length)finalize(l);else{st.lastKey=st.key;st.lastFirst=st.first;}}
 const key=st.lastKey||st.key;const first=st.lastFirst!=null?st.lastFirst:st.first;const msg={gold:"GOLD KEY! You're a master of this skill!",silver:"SILVER KEY! Strong work — a few more first tries and it's gold.",bronze:"BRONZE KEY! You unlocked it. Review the lesson and retake for a shinier key."}[key];
 const idx=T.locks.findIndex(x=>x.id===l.id);const nxt=T.locks.slice(idx+1).concat(T.locks.slice(0,idx)).find(x=>!(S.locks[x.id]&&S.locks[x.id].done));
 let h=lockHead(l,"result")+`<div class="card result"><div class="bigkey">${keySVG(key,130)}</div><h2>${l.name} — Unlocked!</h2><p class="big"><b>${msg}</b></p>
 <div class="rstats"><div class="rstat"><b>${first}/${qs.length}</b><span>right on 1st try</span></div>${(st.lastDok||[]).map((d,i)=>`<div class="rstat"><b>${d[0]}/${d[1]}</b><span>DOK ${i+1} first try</span></div>`).join("")}<div class="rstat"><b>${S.best}</b><span>best streak</span></div><div class="rstat"><b>${S.xp}</b><span>total XP</span></div></div>
 <div class="callout gold" style="text-align:left"><b>🧠 Remember:</b> ${l.remember}</div>
 <div class="navrow" style="justify-content:center"><button class="btn ghost" data-act="retake">🔁 Retake for a better key</button>${nxt?`<button class="btn gold" data-act="open" data-id="${nxt.id}">Next lock: ${esc(nxt.name)} →</button>`:`<button class="btn gold" data-act="home">Back to the locks 🏦</button>`}</div></div>`;
 return h;}

/* ---------- VAULT ---------- */
function vault(){const d=new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
 let h=`<div class="vault"><div class="noprint"><button class="btn ghost sm" data-act="home">← Locks</button></div>${S.vaultOpen?`<div class="opened">🏦✨</div>`:`<div class="door" id="door"><div class="wheel"></div></div>`}`;
 if(!S.vaultOpen)h+=`<h2 class="fred" style="font-size:30px;color:var(--navy)">The Vault</h2><p>You hold all ${T.locks.length} keys. Spin the wheel!</p><button class="btn gold" data-act="spin">🔓 Spin to open</button>`;
 else h+=`<div class="cert" id="cert"><div style="font-size:44px">🏆</div><h1>Vault Unlocked!</h1><p>This certifies that</p><div class="nm">${esc(S.name||"A Super Reader")}</div><p>has mastered <b>${esc(T.title)}</b><br>(Florida FAST Grade 6 ELA Reading)</p><div class="keyring">${T.locks.map(l=>`<span title="${esc(l.name)}">${keySVG(S.locks[l.id].key,46)}</span>`).join("")}</div><p><b>${S.xp} XP</b> · Level: <b>${level().name}</b> · ${S.badges.length} badges</p><p style="color:var(--muted)">${d}</p><p class="noprint"><button class="btn" data-act="print">🖨️ Print certificate</button> <button class="btn ghost" data-act="home">Back to the locks</button></p></div>`;
 return h+`</div>`;}

/* ---------- render + events ---------- */
function render(){TTS.stop();let body="";
 if(S.view==="home")body=home();
 else if(S.view==="vault")body=vault();
 else{const l=lockById(S.lock);if(!l){S.view="home";return render();}
  const st=LS(l.id);const canResult=st.done&&(st.q>=l.questions.length||!st.retake);
  body=S.step==="practice"?((st.retake||!st.done||st.q<l.questions.length)?practice(l):result(l)):S.step==="result"?(canResult?result(l):practice(l)):learn(l);}
 app.innerHTML=topbar()+`<main><div class="wrap">${body}</div></main>`+footer();}
function go(fn){fn();save();render();window.scrollTo(0,0);}
app.addEventListener("click",e=>{
 const sw=e.target.closest("[data-speak]");if(sw){TTS.speak(sw.dataset.speak,sw);return;}
 const sb=e.target.closest("[data-say]");if(sb){const el=document.querySelector(sb.dataset.say);if(el)TTS.speak(textOf(el),sb);return;}
 const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act;const l=S.lock?lockById(S.lock):null;
 switch(act){
  case "name":{const v=($("#nm").value||"").trim();if(!v){$("#nm").focus();return;}S.name=v.slice(0,24);sfx("good");save();render();toast(`👋 Hi, ${esc(S.name)}! Pick a lock to begin.`);break;}
  case "open":go(()=>{S.view="lock";S.lock=b.dataset.id;const st=LS(S.lock);S.step=st.retake?"practice":st.done?"result":st.learned&&st.q>0?"practice":"learn";});sfx("tap");break;
  case "home":go(()=>{S.view="home";});break;
  case "step":{const k=b.dataset.k;const st=LS(l.id);if(k==="result"&&!st.done)return;go(()=>{S.step=k;if(k==="practice"&&st.done&&st.q>=l.questions.length)S.step="result";});break;}
  case "next":go(()=>{const st=LS(l.id);st.card=Math.min(st.card+1,l.lesson.length-1);});sfx("tap");break;
  case "prev":go(()=>{const st=LS(l.id);st.card=Math.max(st.card-1,0);});break;
  case "topractice":go(()=>{const st=LS(l.id);if(!st.learned){st.learned=true;addXP(15,"Lesson complete!");if(T.locks.every(x=>S.locks[x.id]&&S.locks[x.id].learned))award("books");}S.step=st.done&&st.q>=l.questions.length?"result":"practice";});break;
  case "flip":b.classList.toggle("open");sfx("tap");break;
  case "tc":{const ci=+b.dataset.ci,o=+b.dataset.o;const st=LS(l.id);const c=l.lesson[ci];const s=st.tc[ci]||(st.tc[ci]={wrong:[],ok:false});if(s.ok)return;
   if(o===0){s.ok=true;sfx("good");if(!s.wrong.length){addXP(5,"Quick Check");}}else{s.wrong.push(o);sfx("bad");}save();render();break;}
  case "ans":answer(l,+b.dataset.o);break;
  case "hint":{const st=LS(l.id);const a=st.ans[st.q];a.hint=true;st.noHint=false;save();render();break;}
  case "sayq":sayQuestion(l,b);break;
  case "nextq":go(()=>{const st=LS(l.id);st.q++;if(st.q>=l.questions.length){st.lastKey=null;st.lastFirst=null;S.step="result";finalize(l);}});break;
  case "retake":go(()=>{const st=LS(l.id);st.q=0;st.ans={};st.retake=true;st.lastKey=null;st.lastFirst=null;S.step="practice";});toast("🔁 Retake: no XP this time, but you can upgrade your key!");break;
  case "vault":go(()=>{S.view="vault";});break;
  case "spin":{const d=$("#door");d.classList.add("open");sfx("key");setTimeout(()=>{S.vaultOpen=true;award("vault");save();render();confetti(260);setTimeout(()=>confetti(200),900);},1400);break;}
  case "print":window.print();break;
  case "sound":S.sound=!S.sound;save();render();sfx("tap");break;
  case "slow":S.slow=!S.slow;save();render();break;
  case "reset":if(confirm("Erase ALL progress for this tutorial on this device?")&&confirm("Are you sure? This cannot be undone.")){try{localStorage.removeItem(KEY);}catch(e){}S=fresh();render();}break;
 }});
app.addEventListener("keydown",e=>{if(e.target.id==="nm"&&e.key==="Enter"){const btn=document.querySelector('[data-act="name"]');if(btn)btn.click();}});
window.addEventListener("pagehide",save);
render();
})();

</script>
</body>
</html>
